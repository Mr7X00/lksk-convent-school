services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/lksk_school
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:5000}
      - TRUST_PROXY=1
    depends_on:
      - mongodb
    networks:
      - lksk-network

  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - lksk-network

volumes:
  mongo-data:

networks:
  lksk-network:
    driver: bridge
